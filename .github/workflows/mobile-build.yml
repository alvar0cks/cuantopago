name: Expo Mobile Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Check project
        run: npx expo-doctor

      - name: Build
        run: eas build --platform ${{ inputs.platform }} --profile preview --non-interactive --no-wait